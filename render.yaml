services:
  - type: web
    name: hireflow-mini-ats
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev --prefix server && npm install --include=dev --prefix client && npm install --prefix client --no-save @esbuild/linux-x64@0.21.5 @rollup/rollup-linux-x64-gnu && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
